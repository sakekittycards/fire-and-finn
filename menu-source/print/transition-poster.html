<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Island Panda is now Fire & Finn — door and window poster</title>
<!--
  FIRE & FINN TRANSITION POSTER (print). Same system as menu-source/tv/slides.html: dark ground, Jost, the
  fire | sea baseline along the bottom edge, the logo never redrawn or recoloured.
  Two layouts, two sizes, trim or bleed, all from this one file:
    ?size=tabloid                 11 x 17 in door poster: headline, logo, line, address, hours, phone, web.
                                  Headline reads at about 10 ft, details at arm's length (2 to 3 ft).
    ?size=letter                  8.5 x 11 in door poster
    ?size=tabloid&window=1        11 x 17 in window poster: headline and logo only, readable from about 10 ft.
                                  (A 30 ft parking-lot read needs a 3 in cap, which no 11 in sheet can carry.)
    ?size=letter&window=1         8.5 x 11 in window poster
    &bleed=1                      adds 1/8 in bleed on every side (11.25 x 17.25 / 8.75 x 11.25) for the print shop
  Export: msedge --headless=new --disable-gpu --no-pdf-header-footer --virtual-time-budget=4000
          --print-to-pdf="transition-poster-door-11x17.pdf" "file:///.../transition-poster.html?size=tabloid"
  The bleed PDFs go to the print shop (Royal Crest did the menu) on oversize stock and get trimmed; a CMYK copy is
  made with Ghostscript. Nothing here is for a home inkjet or an office laser: the ground is full-bleed near-black.
  Retire the day the permanent sign goes up.
  Sizes are in --u (1/100 of the trim width) and --v (1/100 of the trim height), set in inches by the script, so a
  bleed page is the identical trim design with the ground and baseline carried 1/8 in past the trim.
  The claim is "Same kitchen. Same address. New name." and nothing more: the business and the address are the
  same; nothing here names people.
-->
<style>
  @font-face { font-family: "Jost"; font-weight: 400; src: url("../../assets/fonts/Jost-400.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 500; src: url("../../assets/fonts/Jost-500.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 600; src: url("../../assets/fonts/Jost-600.woff2") format("woff2"); }
  :root { --bg:#0B0C0E; --ink:#F2F0EB; --muted:#CFCAC2; --dim:#A39D95; --fire:#F07840; --sea:#62C6EC;
    --u: .11in; --v: .17in; --bleed: 0in; --m: calc(var(--u) * 7); --base: calc(var(--v) * 4.4); }
  * { box-sizing: border-box; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Jost", sans-serif; }
  .sheet { position: relative; width: calc(var(--u) * 100); height: calc(var(--v) * 100); margin: var(--bleed); background: var(--bg); }
  .glow { position: absolute; left: calc(var(--bleed) * -1); right: calc(var(--bleed) * -1); top: 0; bottom: var(--base); pointer-events: none;
    background: radial-gradient(48% 40% at 14% 103%, rgba(240,120,64,.30), rgba(240,120,64,0) 70%), radial-gradient(48% 40% at 86% 103%, rgba(98,198,236,.24), rgba(98,198,236,0) 70%); }
  .base { position: absolute; left: calc(var(--bleed) * -1); right: calc(var(--bleed) * -1); bottom: calc(var(--bleed) * -1); height: calc(var(--base) + var(--bleed)); background: linear-gradient(90deg, var(--fire) 0 50%, var(--sea) 50% 100%); }
  .copy { position: absolute; left: var(--m); right: var(--m); top: 0; bottom: var(--base); display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; text-align: center; padding: calc(var(--v) * 4) 0 calc(var(--v) * 2); }
  .was { font: 600 calc(var(--u) * 13.5)/1 "Jost"; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
  .now { font: 400 calc(var(--u) * 6)/1 "Jost"; color: var(--dim); margin-top: calc(var(--u) * 2.2); }
  .logo { width: calc(var(--u) * 74); display: block; }
  .line { font: 600 calc(var(--u) * 4.9)/1.15 "Jost"; letter-spacing: -.005em; color: var(--ink); }
  .meta { font: 400 calc(var(--u) * 3.1)/1.5 "Jost"; color: var(--muted); }
  .meta b { font-weight: 500; color: var(--ink); }
  .meta .tel { display: block; font: 600 calc(var(--u) * 4)/1.4 "Jost"; color: var(--ink); margin-top: calc(var(--u) * .8); }
  .meta .web { display: block; font: 600 calc(var(--u) * 3.6)/1.4 "Jost"; color: var(--sea); margin-top: calc(var(--u) * .4); }

  /* window version: headline and logo only, larger */
  .window .was { font-size: calc(var(--u) * 15.5); }
  .window .now { font-size: calc(var(--u) * 7); }
  .window .logo { width: calc(var(--u) * 84); }
  .window .copy { justify-content: center; gap: calc(var(--v) * 6); }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="glow"></div>
  <div class="copy">
    <div>
      <p class="was">Island Panda</p>
      <p class="now">is now</p>
    </div>
    <img class="logo" src="../../assets/logo-compact.svg" alt="Fire &amp; Finn">
    <p class="line" id="line">Same kitchen. Same address.<br>New name.</p>
    <p class="meta" id="meta"><b data-loc="address"></b>, <span data-loc="city"></span><br>Open daily <b data-loc="hours"></b><span class="tel" data-loc="phone"></span><span class="web" data-loc="web"></span></p>
  </div>
  <div class="base"></div>
</div>
<script src="../tv/location.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const letter = q.get("size") === "letter";
  const W = letter ? 8.5 : 11, H = letter ? 11 : 17, B = q.get("bleed") ? 0.125 : 0;
  const r = document.documentElement.style;
  r.setProperty("--u", (W / 100) + "in"); r.setProperty("--v", (H / 100) + "in"); r.setProperty("--bleed", B + "in");
  const st = document.createElement("style");
  st.textContent = "@page { size: " + (W + 2 * B) + "in " + (H + 2 * B) + "in; margin: 0; }";
  document.head.appendChild(st);
  if (q.get("window") || q.get("big")) { document.getElementById("sheet").classList.add("window"); document.getElementById("line").remove(); document.getElementById("meta").remove(); }
  document.querySelectorAll("[data-loc]").forEach((el) => { el.textContent = LOCATION[el.dataset.loc] || ""; });
</script>
</body>
</html>
