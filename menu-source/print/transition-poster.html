<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Island Panda is now Fire & Finn — door and window poster</title>
<!--
  FIRE & FINN TRANSITION POSTER (print). Same system as menu-source/tv/slides.html: dark ground, Jost, the
  fire | sea baseline along the bottom edge, the logo never redrawn or recoloured.
  Two layouts, two sizes, all from this one file:
    ?size=tabloid          11 x 17 in, full poster (headline, logo, line, address, hours, web)
    ?size=letter           8.5 x 11 in, full poster
    ?size=tabloid&big=1    11 x 17 in, parking-lot version: the headline is the poster
    ?size=letter&big=1     8.5 x 11 in, parking-lot version
  Export: msedge --headless=new --disable-gpu --no-pdf-header-footer --virtual-time-budget=4000
          --print-to-pdf="transition-poster-11x17.pdf" "file:///.../transition-poster.html?size=tabloid"
  Print on a laser printer or at a print shop. Inkjet cannot lay down this much black evenly.
  Retire the day the permanent sign goes up. Every size is set in vw so both page sizes share one layout.
  The claim is "Same kitchen. Same address. New name." and nothing more: the business and the address are the
  same; nothing here names people.
-->
<style>
  @font-face { font-family: "Jost"; font-weight: 400; src: url("../../assets/fonts/Jost-400.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 500; src: url("../../assets/fonts/Jost-500.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 600; src: url("../../assets/fonts/Jost-600.woff2") format("woff2"); }
  :root { --bg:#0B0C0E; --ink:#F2F0EB; --muted:#CFCAC2; --dim:#A39D95; --fire:#F07840; --sea:#62C6EC; --m:7vw; --base:4.4vh; }
  * { box-sizing: border-box; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Jost", sans-serif; }
  .sheet { position: relative; width: 100vw; height: 100vh; background: var(--bg); overflow: hidden; }
  .glow { position: absolute; left: 0; right: 0; top: 0; bottom: var(--base); pointer-events: none;
    background: radial-gradient(48% 40% at 14% 103%, rgba(240,120,64,.30), rgba(240,120,64,0) 70%), radial-gradient(48% 40% at 86% 103%, rgba(98,198,236,.24), rgba(98,198,236,0) 70%); }
  .base { position: absolute; left: 0; right: 0; bottom: 0; height: var(--base); background: linear-gradient(90deg, var(--fire) 0 50%, var(--sea) 50% 100%); }
  .copy { position: absolute; left: var(--m); right: var(--m); top: 0; bottom: var(--base); display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; text-align: center; padding: 4vh 0 2vh; }
  .was { font: 600 13.5vw/1 "Jost"; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
  .now { font: 400 6vw/1 "Jost"; color: var(--dim); margin-top: 2.2vw; }
  .logo { width: 74vw; display: block; }
  .line { font: 600 4.9vw/1.15 "Jost"; letter-spacing: -.005em; color: var(--ink); }
  .meta { font: 400 3.1vw/1.5 "Jost"; color: var(--muted); }
  .meta b { font-weight: 500; color: var(--ink); }
  .meta .web { display: block; font: 600 3.6vw/1.4 "Jost"; color: var(--sea); margin-top: .6vw; }

  /* parking-lot version: headline and logo only, larger */
  .big .was { font-size: 15.5vw; }
  .big .now { font-size: 7vw; }
  .big .logo { width: 84vw; }
  .big .copy { justify-content: center; gap: 6vh; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="glow"></div>
  <div class="copy">
    <div>
      <p class="was">Island Panda</p>
      <p class="now">is now</p>
    </div>
    <img class="logo" src="../../assets/logo-compact.svg" alt="Fire &amp; Finn">
    <p class="line" id="line">Same kitchen. Same address.<br>New name.</p>
    <p class="meta" id="meta"><b data-loc="address"></b>, <span data-loc="city"></span><br>Open daily <b data-loc="hours"></b><span class="web" data-loc="web"></span></p>
  </div>
  <div class="base"></div>
</div>
<script src="../tv/location.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const size = q.get("size") === "letter" ? "8.5in 11in" : "11in 17in";
  const st = document.createElement("style"); st.textContent = "@page { size: " + size + "; margin: 0; }"; document.head.appendChild(st);
  if (q.get("big")) { document.getElementById("sheet").classList.add("big"); document.getElementById("line").remove(); document.getElementById("meta").remove(); }
  document.querySelectorAll("[data-loc]").forEach((el) => { el.textContent = LOCATION[el.dataset.loc] || ""; });
</script>
</body>
</html>
